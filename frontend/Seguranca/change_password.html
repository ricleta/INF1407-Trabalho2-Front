<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <div id="navbar-container">
        <!-- Navbar will be dynamically injected here -->
        <nav>
            <ul>
                
            </ul>
        </nav>
    </div>
    <h1>Change Password</h1>
    <form id="change-password-form">
        <fieldset style="width: max-content;">
            <legend>Update your password</legend>
            <div class="form-group">
                <label for="old_password">Old Password or Temporary Password:</label>
                <input type="password" id="old_password" name="old_password" required>
            </div>
            <div class="form-group">
                <label for="new_password1">New Password:</label>
                <input type="password" id="new_password1" name="new_password1" required>
            </div>
            <div class="form-group">
                <label for="new_password2">Confirm New Password:</label>
                <input type="password" id="new_password2" name="new_password2" required>
            </div>
            <button type="submit" id="submit-button">Change Password</button>
        </fieldset>
    </form>
    <div id="result"></div>

    <script type="module" src="../js/Seguranca/change_password.js"></script>
    <script type="module" src="../js/navbar.js"></script>
</body>
</html>
