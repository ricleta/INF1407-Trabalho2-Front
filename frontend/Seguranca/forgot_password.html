<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a Senha</title>
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <div id="navbar-container">
        <!-- Navbar will be dynamically injected here -->
        <nav>
            <ul>
                
            </ul>
        </nav>
    </div>
    <div class="container">
        <h2>Esqueceu sua senha?</h2>
        <p>Digite seu e-mail e enviaremos uma senha temporária para você.</p>
        <form id="forgot-password-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            <button type="submit" id="submit-button">Redefinir Senha</button>
        </form>
        <div id="message-container" class="message"></div>
    </div>
    <div id="result">

    </div>
    <script type="module" src="../js/Seguranca/forgot_password.js"></script>
    <script type="module" src="../js/navbar.js"></script>
</body>
