<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../../css/estilo.css">
</head>
<body>
    <div id="navbar-container">
        <!-- Navbar will be dynamically injected here -->
        <nav>
            <ul>
                
            </ul>
        </nav>
    </div>
    <h1>Login</h1>
    <form id="login-form">
        <fieldset style="width: max-content;">
            <legend>Acessar sua conta</legend>
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" id="submit-button">Entrar</button>
        </fieldset>
    </form>
    <div id="result"></div>
    <p><a href="password_reset_form.html">Esqueceu a senha?</a></p>

    <script type="module" src="../../js/Seguranca/login.js"></script>
    <script type="module" src="../../js/navbar.js"></script>
</body>
</html>
