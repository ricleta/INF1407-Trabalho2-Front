{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Avaliação</title>
    <link rel="stylesheet" href="{% static 'Games/css/estilo.css' %}">
</head>
<body>
    <div id="navbar-container">
        <!-- Navbar will be dynamically injected here -->
        <nav>
            <ul>
                
            </ul>
        </nav>
    </div>
    
    <h1>Excluir Avaliação</h1>
    
    <p>Deseja realmente excluir a avaliação de "{{ review.game.title }}"?</p>
    <form action="" method="POST">
        {% csrf_token %}
        <button type="submit">Confirmar Exclusão</button>
        <a href="{% url 'Reviews:lista-reviews' %}">Cancelar</a>
    </form>

    <script type="module" src="../../js/navbar.js"></script>
</body>
</html>
