<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus jogos</title>
    <link rel="stylesheet" href="../../css/estilo.css">
</head>
<body>
    <nav>
        <!-- Static links, dynamic ones will be handled by JS -->
        <a href="/">Home-Page</a>
        <a href="/games/lista">Todos os jogos</a>
        <!-- Links for authenticated users can be shown/hidden with JS -->
        <span id="auth-links" style="display: none;">
            <a href="/games/mygames">Meus Jogos</a>
            <a href="/games/criar">Criar Jogo</a>
        </span>
    </nav>
    <h1>Meus Jogos Cadastrados</h1>
    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Plataformas</th>
                <th>Descrição</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="my-games-list">
            <!-- Game rows will be dynamically inserted here by TypeScript -->
        </tbody>
    </table>
    <div id="loading-message"></div>

    <script type="module" src="../../js/Games/home_page_games.js"></script>
</body>
</html>
