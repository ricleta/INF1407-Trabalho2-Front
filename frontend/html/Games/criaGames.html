<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Criar Jogo</title>
    <link rel="stylesheet" href="../../css/estilo.css">
</head>
<body>
    <nav>
        <!-- Static links, dynamic ones will be handled by JS -->
        <a href="/">Home-Page</a>
        <a href="/games/lista">Todos os jogos</a>
        <!-- Links for authenticated users can be shown/hidden with JS -->
        <span id="auth-links" style="display: none;">
            <a href="/html/Games/home_page_games.html">Meus Jogos</a>
            <a href="/games/criar">Criar Jogo</a>
        </span>
    </nav>
    
    <h1 id="form-title">Criar um Jogo</h1>

    <form id="game-form">
        <fieldset style="width: max-content;">
            <legend>Novo Jogo</legend>
            <div class="form-group">
                <label for="title">Título:</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="platforms">Plataformas (separadas por vírgula):</label>
                <input type="text" id="platforms" name="platforms" placeholder="PC, Xbox, PlayStation" required>
            </div>
            <div class="form-group">
                <label for="description">Descrição:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>
            <div class="form-group">
                <label for="release_date">Data de Lançamento:</label>
                <input type="date" id="release_date" name="release_date" required>
            </div>
            <button type="submit" id="submit-button">Criar Jogo</button>
        </fieldset>
    </form>
    <div id="result"></div>

    <script type="module" src="../../js/Games/criaGames.js"></script>
</body>
</html>
