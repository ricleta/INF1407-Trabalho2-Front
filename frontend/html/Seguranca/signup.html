<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="../../css/estilo.css">
</head>
<body>
    <nav>
        <a href="/">Home-Page</a>
        <a href="/games/lista">Todos os jogos</a>
        <!-- Static auth links -->
        <a href="/seguranca/login.html">Entrar</a>
        <a href="/seguranca/signup.html">Cadastrar</a>
    </nav>
    <h1>Cadastro de Usuário</h1>
    <form id="signup-form">
        <fieldset style="width: max-content;">
            <legend>Criar nova conta</legend>
            <div class="form-group">
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="group">Tipo de conta:</label>
                <select id="group" name="group" required>
                    <option value="" disabled selected>Selecione um tipo</option>
                    <option value="developer">Desenvolvedor de Jogos (GameDev)</option>
                    <option value="reviewer">Avaliador (Reviewer)</option>
                </select>
            </div>
            <button type="submit" id="submit-button">Cadastrar</button>
        </fieldset>
    </form>
    <div id="result"></div>
    <script src="../../js/Seguranca/signup.js"></script>
</body>
</html>
